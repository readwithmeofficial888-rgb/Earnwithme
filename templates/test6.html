<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fruit Shop Tycoon 👨‍🌾 Stand Progression</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      transition: background 0.8s ease;
      position: fixed; /* Prevents bounce scroll on iOS */
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    /* Top HUD Header */
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 500;
      pointer-events: none;
    }

    .hud-card {
      background: #ffffff;
      border: 3px solid #212121;
      border-radius: 16px;
      padding: 6px 12px;
      box-shadow: 3px 3px 0px #212121;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: #212121;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
    }

    .btn-action {
      background: #ffca28;
      border: 3px solid #212121;
      border-radius: 16px;
      padding: 6px 12px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(0.8rem, 2.2vw, 0.95rem);
      color: #212121;
      cursor: pointer;
      box-shadow: 3px 3px 0px #212121;
      transition: transform 0.1s;
      pointer-events: auto;
    }

    .btn-action:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #212121;
    }

    /* Customer Counter Bar */
    #market-stand {
      position: absolute;
      top: 60px;
      left: 10px;
      right: 10px;
      height: 70px;
      border: 4px solid #212121;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      box-shadow: 4px 4px 0px #212121;
      z-index: 100;
      transition: background 0.5s ease;
    }

    .stand-title {
      font-family: 'Fredoka One', cursive;
      color: #ffffff;
      font-size: clamp(0.85rem, 2.8vw, 1.1rem);
      text-shadow: 2px 2px 0px #212121;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .progress-bar-container {
      width: clamp(70px, 18vw, 120px);
      height: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      border: 2px solid #fff;
      overflow: hidden;
      margin-top: 2px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #00e676;
      transition: width 0.3s ease;
    }

    .customer-queue {
      display: flex;
      gap: 6px;
    }

    .customer {
      font-size: clamp(1.4rem, 4vw, 2rem);
      animation: bounce 1s infinite alternate ease-in-out;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* Open Meadow Space */
    #meadow {
      position: absolute;
      top: 140px;
      left: 10px;
      right: 10px;
      bottom: 45px;
      background: rgba(255, 255, 255, 0.2);
      border: 5px dashed rgba(255, 255, 255, 0.5);
      border-radius: 25px;
      overflow: hidden;
    }

    /* Gardener Character */
    #gardener {
      position: absolute;
      width: 50px;
      height: 50px;
      font-size: clamp(2rem, 5vw, 2.6rem);
      z-index: 800;
      transition: left 0.6s linear, top 0.6s linear;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Garden Item */
    .garden-item {
      position: absolute;
      width: clamp(55px, 12vw, 70px);
      height: clamp(55px, 12vw, 70px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: grab;
      z-index: 10;
      transition: transform 0.1s ease-out;
    }

    .garden-item.dragging {
      z-index: 1000 !important;
      transform: scale(1.25) !important;
      cursor: grabbing;
    }

    .item-emoji {
      font-size: clamp(2.2rem, 6vw, 2.8rem);
      filter: drop-shadow(2px 4px 0px rgba(0,0,0,0.25));
      pointer-events: none;
    }

    .item-level {
      font-size: clamp(0.6rem, 1.5vw, 0.75rem);
      font-weight: 900;
      background: #ffffff;
      border: 2px solid #212121;
      border-radius: 8px;
      padding: 0px 4px;
      position: absolute;
      bottom: -2px;
      box-shadow: 1px 1px 0px #212121;
      pointer-events: none;
    }

    /* Animations */
    @keyframes fastDrop {
      0% { transform: translateY(-150px) scale(0.6); opacity: 0; }
      80% { transform: translateY(10px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .fast-drop {
      animation: fastDrop 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes popMerge {
      0% { transform: scale(0.3); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .pop-merge {
      animation: popMerge 0.25s ease-out forwards;
    }

    .footer-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #212121;
      border-radius: 12px;
      padding: 3px 12px;
      box-shadow: 2px 2px 0px #212121;
      font-weight: 900;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      color: #212121;
      text-align: center;
      z-index: 500;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- HUD Header -->
  <div class="hud">
    <div class="hud-card">🪙 <span id="coins">50</span></div>
    <div class="hud-card"><span id="fruit-icon">🍎</span> <span id="fruits">0</span></div>
    <div style="display: flex; gap: 5px;">
      <button class="btn-action" onclick="organizeGarden()">🧹 Clean</button>
      <button class="btn-action" onclick="buyBox()" style="background: #00e676;">📦 Buy (20🪙)</button>
    </div>
  </div>

  <!-- Customer Market Stand -->
  <div id="market-stand">
    <div class="stand-title">
      <span id="shop-name">🍎 APPLE STAND</span>
      <div class="progress-bar-container">
        <div id="shop-progress" class="progress-bar-fill"></div>
      </div>
    </div>
    <div class="customer-queue" id="customer-queue"></div>
  </div>

  <!-- Open Meadow Space -->
  <div id="meadow">
    <div id="gardener">👨‍🌾</div>
  </div>

  <!-- Footer Info -->
  <div class="footer-hint">
    👨‍🌾 Trees disappear after harvest! Sell 10 fruits to unlock next shop!
  </div>
</div>

<script>
  // 10 Fruit Shops Progression Config
  const SHOPS = [
    { fruit: "🍎", name: "APPLE STAND", standColor: "#d84315", bgGradient: "radial-gradient(circle, #81c784, #4caf50, #2e7d32)" },
    { fruit: "🍌", name: "BANANA HUT", standColor: "#fbc02d", bgGradient: "radial-gradient(circle, #fff59d, #fbc02d, #f57f17)" },
    { fruit: "🍊", name: "ORANGE GROVE", standColor: "#ef6c00", bgGradient: "radial-gradient(circle, #ffcc80, #ffa726, #e65100)" },
    { fruit: "🍇", name: "GRAPE VINEYARD", standColor: "#6a1b9a", bgGradient: "radial-gradient(circle, #ce93d8, #ab47bc, #4a148c)" },
    { fruit: "🍓", name: "STRAWBERRY PATCH", standColor: "#c2185b", bgGradient: "radial-gradient(circle, #f8bbd0, #ec407a, #880e4f)" },
    { fruit: "🍑", name: "PEACH ORCHARD", standColor: "#e64a19", bgGradient: "radial-gradient(circle, #ffccbc, #ff8a65, #bf360c)" },
    { fruit: "🍍", name: "PINEAPPLE BAR", standColor: "#f57f17", bgGradient: "radial-gradient(circle, #ffe082, #ffd54f, #ff8f00)" },
    { fruit: "🍉", name: "WATERMELON OASIS", standColor: "#2e7d32", bgGradient: "radial-gradient(circle, #a5d6a7, #66bb6a, #1b5e20)" },
    { fruit: "🍒", name: "CHERRY GARDEN", standColor: "#b71c1c", bgGradient: "radial-gradient(circle, #ef9a9a, #e57373, #880e4f)" },
    { fruit: "🥑", name: "AVOCADO HAVEN", standColor: "#33691e", bgGradient: "radial-gradient(circle, #c5e1a5, #9ccc65, #1b5e20)" }
  ];

  let currentShopIdx = 0;
  let shopSalesCount = 0;
  let coins = 50;
  let harvestedFruits = 0;
  let items = [];
  let customers = ["👵", "👦", "👧"];
  let nextId = 1;
  let isGardenerBusy = false;

  const meadow = document.getElementById("meadow");
  const gameContainer = document.getElementById("game-container");
  const coinsEl = document.getElementById("coins");
  const fruitsEl = document.getElementById("fruits");
  const fruitIconEl = document.getElementById("fruit-icon");
  const queueEl = document.getElementById("customer-queue");
  const gardenerEl = document.getElementById("gardener");
  const marketStand = document.getElementById("market-stand");
  const shopNameEl = document.getElementById("shop-name");
  const shopProgressEl = document.getElementById("shop-progress");

  let gardenerPos = { x: 20, y: 20 };
  gardenerEl.style.left = `${gardenerPos.x}px`;
  gardenerEl.style.top = `${gardenerPos.y}px`;

  function applyShopTheme() {
    const shop = SHOPS[currentShopIdx];
    shopNameEl.innerText = `${shop.fruit} ${shop.name}`;
    marketStand.style.backgroundColor = shop.standColor;
    gameContainer.style.background = shop.bgGradient;
    fruitIconEl.innerText = shop.fruit;
    shopProgressEl.style.width = `${(shopSalesCount / 10) * 100}%`;
  }

  function renderCustomers() {
    queueEl.innerHTML = customers.map(c => `<div class="customer">${c}</div>`).join("");
  }

  function getEvolutionData(level) {
    const currentFruit = SHOPS[currentShopIdx].fruit;
    const evo = [
      { level: 0, emoji: "📦" },
      { level: 1, emoji: "🌱" },
      { level: 2, emoji: "🌿" },
      { level: 3, emoji: "🪻" },
      { level: 4, emoji: "🌺" },
      { level: 5, emoji: "🌳" },
      { level: 6, emoji: currentFruit }
    ];
    return evo[level];
  }

  function spawnItem(level = 0, customX = null, customY = null) {
    const rect = meadow.getBoundingClientRect();
    const itemWidth = 60;
    const padding = 70;

    const x = customX !== null ? customX : Math.random() * (rect.width - padding) + 5;
    const y = customY !== null ? customY : Math.random() * (rect.height - padding) + 5;

    const itemData = {
      id: nextId++,
      level: level,
      x: x,
      y: y,
      hasFruit: level === 6
    };

    items.push(itemData);
    createItemDOM(itemData, level === 0);
  }

  function createItemDOM(itemData, isNewBox = false) {
    const el = document.createElement("div");
    el.className = "garden-item" + (isNewBox ? " fast-drop" : " pop-merge");
    el.id = `item-${itemData.id}`;
    el.style.left = `${itemData.x}px`;
    el.style.top = `${itemData.y}px`;

    updateItemContent(el, itemData);

    // Unbox Click/Tap
    const handleUnbox = (e) => {
      if (itemData.level === 0) {
        itemData.level = 1;
        updateItemContent(el, itemData);
        el.classList.remove("fast-drop");
        void el.offsetWidth;
        el.classList.add("pop-merge");
      }
    };

    el.addEventListener("click", handleUnbox);
    setupUniversalDrag(el, itemData);
    meadow.appendChild(el);
  }

  function updateItemContent(el, itemData) {
    const evo = getEvolutionData(itemData.level);
    el.innerHTML = `
      <span class="item-emoji">${evo.emoji}</span>
      ${itemData.level > 0 ? `<span class="item-level">Lvl ${itemData.level}</span>` : ""}
    `;
  }

  // Cross-Platform Mouse & Touch Drag Engine
  function setupUniversalDrag(el, itemData) {
    let isDragging = false;
    let startX, startY;

    function getCoords(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function onStart(e) {
      isDragging = true;
      el.classList.add("dragging");

      const coords = getCoords(e);
      startX = coords.x - itemData.x;
      startY = coords.y - itemData.y;
    }

    function onMove(e) {
      if (!isDragging) return;
      const coords = getCoords(e);
      const rect = meadow.getBoundingClientRect();
      const itemSize = el.offsetWidth;

      itemData.x = Math.max(0, Math.min(rect.width - itemSize, coords.x - startX));
      itemData.y = Math.max(0, Math.min(rect.height - itemSize, coords.y - startY));

      el.style.left = `${itemData.x}px`;
      el.style.top = `${itemData.y}px`;
    }

    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      el.classList.remove("dragging");
      checkMerge(itemData);
    }

    // Mouse Listeners (PC)
    el.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);

    // Touch Listeners (Mobile)
    el.addEventListener("touchstart", onStart, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onEnd);
  }

  function checkMerge(sourceItem) {
    const mergeThreshold = 50;

    for (let i = 0; i < items.length; i++) {
      const targetItem = items[i];
      if (targetItem.id === sourceItem.id) continue;

      const dist = Math.hypot(sourceItem.x - targetItem.x, sourceItem.y - targetItem.y);

      if (dist < mergeThreshold) {
        if (sourceItem.level === targetItem.level && sourceItem.level > 0 && sourceItem.level < 6) {
          targetItem.level++;
          if (targetItem.level === 6) targetItem.hasFruit = true;

          const targetEl = document.getElementById(`item-${targetItem.id}`);
          updateItemContent(targetEl, targetItem);
          targetEl.classList.remove("pop-merge");
          void targetEl.offsetWidth;
          targetEl.classList.add("pop-merge");

          removeItem(sourceItem.id);
          break;
        }
      }
    }
  }

  function removeItem(id) {
    items = items.filter(it => it.id !== id);
    const el = document.getElementById(`item-${id}`);
    if (el) el.remove();
  }

  function buyBox() {
    if (coins >= 20) {
      coins -= 20;
      coinsEl.innerText = coins;
      spawnItem(0);
    }
  }

  function organizeGarden() {
    const rect = meadow.getBoundingClientRect();
    const itemSpacing = Math.min(75, rect.width / 4);
    const cols = Math.floor(rect.width / itemSpacing);
    
    items.forEach((item, idx) => {
      const row = Math.floor(idx / cols);
      const col = idx % cols;
      item.x = col * itemSpacing + 5;
      item.y = row * itemSpacing + 5;

      const el = document.getElementById(`item-${item.id}`);
      if (el) {
        el.style.left = `${item.x}px`;
        el.style.top = `${item.y}px`;
      }
    });
  }

  // Gardener AI Task Loop
  async function gardenerTaskLoop() {
    if (isGardenerBusy) return;

    const readyTree = items.find(it => it.level === 6 && it.hasFruit);

    if (readyTree) {
      isGardenerBusy = true;

      gardenerEl.style.left = `${readyTree.x + 5}px`;
      gardenerEl.style.top = `${readyTree.y + 5}px`;

      await new Promise(r => setTimeout(r, 650));

      const currentFruit = SHOPS[currentShopIdx].fruit;
      harvestedFruits++;
      fruitsEl.innerText = harvestedFruits;
      gardenerEl.innerText = `👨‍🌾${currentFruit}`;

      // Disappear tree after harvest
      removeItem(readyTree.id);

      if (customers.length > 0 && harvestedFruits > 0) {
        gardenerEl.style.left = `100px`;
        gardenerEl.style.top = `-30px`;

        await new Promise(r => setTimeout(r, 650));

        harvestedFruits--;
        coins += 50;
        shopSalesCount++;

        fruitsEl.innerText = harvestedFruits;
        coinsEl.innerText = coins;

        customers.shift();
        renderCustomers();
        gardenerEl.innerText = "👨‍🌾";

        if (shopSalesCount >= 10) {
          shopSalesCount = 0;
          currentShopIdx = (currentShopIdx + 1) % SHOPS.length;
          applyShopTheme();
        } else {
          shopProgressEl.style.width = `${(shopSalesCount / 10) * 100}%`;
        }
      }

      isGardenerBusy = false;
    }
  }

  // Spawners
  setInterval(() => {
    if (customers.length < 5) {
      const customerEmojis = ["👵", "👦", "👧", "🧔", "👩‍🦰", "👴"];
      customers.push(customerEmojis[Math.floor(Math.random() * customerEmojis.length)]);
      renderCustomers();
    }
  }, 3500);

  setInterval(() => {
    if (items.length < 25) {
      spawnItem(0);
    }
  }, 2200);

  setInterval(gardenerTaskLoop, 700);

  // Initialize
  applyShopTheme();
  renderCustomers();
  spawnItem(0);
  spawnItem(0);
</script>

</body>
</html>
