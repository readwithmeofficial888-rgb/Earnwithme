<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Rocket Run: Hyperdrive 🚀✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Nunito', sans-serif;
    }

    /* Fullscreen Game Canvas Container */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #110826 0%, #000000 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Overlay */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-card {
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #212121;
      border-radius: 16px;
      padding: 8px 16px;
      box-shadow: 4px 4px 0px #212121;
      font-weight: 900;
      font-size: 1.1rem;
      color: #212121;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shield-badge {
      background: #00e676;
      color: #212121;
      display: none;
    }

    /* Start / Pause / Gameover Screen */
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 10, 26, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      color: #ff5722;
      margin: 0;
      text-shadow: 5px 5px 0px #212121;
      -webkit-text-stroke: 2px #212121;
      line-height: 1;
    }

    .subtitle {
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      color: #00e676;
      font-weight: 900;
      margin: 0;
      text-shadow: 2px 2px 0px #000;
    }

    .btn-play {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.3rem, 4vw, 2rem);
      padding: 16px 40px;
      border: 5px solid #212121;
      border-radius: 20px;
      background: #76ff03;
      color: #212121;
      cursor: pointer;
      box-shadow: 6px 6px 0px #212121;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-play:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0px #212121;
    }

    .controls-hint {
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      opacity: 0.8;
      max-width: 380px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Top HUD -->
  <div class="hud">
    <div class="hud-card">🚀 SCORE: <span id="score">0</span></div>
    <div class="hud-card shield-badge" id="shield-ui">🛡️ SHIELD ACTIVE</div>
    <div class="hud-card">🏆 BEST: <span id="best">0</span></div>
  </div>

  <!-- Game Canvas -->
  <canvas id="canvas"></canvas>

  <!-- Start / Game Over Overlay -->
  <div class="screen-overlay" id="overlay">
    <h1 class="title" id="title-text">HYPERDRIVE!</h1>
    <p class="subtitle" id="sub-text">Dodge hazards, gather coins, activate shields!</p>
    <button class="btn-play" onclick="startGame()">LAUNCH 🚀</button>
    <div class="controls-hint">
      🎮 <b>PC Controls:</b> Drag mouse or Arrow Keys / AD<br>
      📱 <b>Mobile Controls:</b> Touch and drag anywhere on screen
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Dynamic Window Scaling
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Game Engine State
  let isPlaying = false;
  let score = 0;
  let best = localStorage.getItem("rocket_hyperdrive_best") || 0;
  document.getElementById("best").innerText = best;

  let shakeTime = 0;
  let gameSpeed = 4;
  let spawnTimer = 0;

  // Player Object
  let player = {
    x: 0,
    y: 0,
    width: 44,
    height: 44,
    shield: false,
    trail: []
  };

  let hazards = [];
  let items = [];
  let particles = [];
  let stars = [];

  // Create Background Stars
  for (let i = 0; i < 70; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2.5 + 0.5,
      speed: Math.random() * 3 + 1
    });
  }

  // Keyboard Controls
  let keys = {};
  window.addEventListener("keydown", e => keys[e.key] = true);
  window.addEventListener("keyup", e => keys[e.key] = false);

  // Mouse & Touch Movement
  let isPointerDown = false;

  function handlePointerMove(clientX, clientY) {
    if (!isPlaying) return;
    player.x = clientX - player.width / 2;
    player.y = clientY - player.height / 2;
  }

  window.addEventListener("mousedown", () => isPointerDown = true);
  window.addEventListener("mouseup", () => isPointerDown = false);
  window.addEventListener("mousemove", e => {
    if (isPointerDown || isPlaying) {
      handlePointerMove(e.clientX, e.clientY);
    }
  });

  window.addEventListener("touchstart", e => {
    if (e.touches.length > 0) {
      handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  window.addEventListener("touchmove", e => {
    if (e.touches.length > 0) {
      handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  function startGame() {
    isPlaying = true;
    score = 0;
    gameSpeed = 5;
    hazards = [];
    items = [];
    particles = [];
    player.shield = false;
    player.x = canvas.width / 2 - 22;
    player.y = canvas.height * 0.75;

    document.getElementById("score").innerText = "0";
    document.getElementById("shield-ui").style.display = "none";
    document.getElementById("overlay").style.display = "none";

    requestAnimationFrame(gameLoop);
  }

  function gameOver() {
    isPlaying = false;
    shakeTime = 20;

    if (score > best) {
      best = score;
      localStorage.setItem("rocket_hyperdrive_best", best);
      document.getElementById("best").innerText = best;
    }

    document.getElementById("title-text").innerText = "CRASHED!";
    document.getElementById("sub-text").innerText = `Final Score: ${score} Points!`;
    document.getElementById("overlay").style.display = "flex";
  }

  function spawnExplosion(x, y, color) {
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        size: Math.random() * 6 + 2,
        color: color,
        life: 25
      });
    }
  }

  // AABB Collision Detection Helper
  function isColliding(a, b) {
    return (
      a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y
    );
  }

  function gameLoop() {
    if (!isPlaying) return;

    // Screen Shake Effect
    ctx.save();
    if (shakeTime > 0) {
      ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
      shakeTime--;
    }

    // Clear Screen
    ctx.fillStyle = "#0c061a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Render & Move Stars (Speed lines effect)
    ctx.fillStyle = "#ffffff";
    stars.forEach(s => {
      s.y += s.speed + (gameSpeed * 0.5);
      if (s.y > canvas.height) {
        s.y = 0;
        s.x = Math.random() * canvas.width;
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });

    // Keyboard Controls Update
    const moveSpeed = 9;
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= moveSpeed;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += moveSpeed;
    if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.y -= moveSpeed;
    if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.y += moveSpeed;

    // Bound Player Inside Canvas
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

    // Engine Particle Trail
    player.trail.push({ x: player.x + 22, y: player.y + 40, life: 10 });
    player.trail.forEach((t, index) => {
      t.life--;
      ctx.fillStyle = `rgba(255, 145, 0, ${t.life / 10})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.life * 0.8, 0, Math.PI * 2);
      ctx.fill();
      if (t.life <= 0) player.trail.splice(index, 1);
    });

    // Draw Rocket Player
    ctx.font = "40px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🚀", player.x + 22, player.y + 22);

    // Draw Shield Aura if active
    if (player.shield) {
      ctx.strokeStyle = "#00e676";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(player.x + 22, player.y + 22, 32, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Spawning Logic
    spawnTimer++;
    if (spawnTimer % Math.max(8, Math.floor(25 - gameSpeed * 0.5)) === 0) {
      // Spawn Hazards
      const hazardEmojis = ["🪨", "☄️", "👾", "🛰️"];
      hazards.push({
        x: Math.random() * (canvas.width - 40),
        y: -50,
        width: 36,
        height: 36,
        speed: gameSpeed + Math.random() * 3,
        emoji: hazardEmojis[Math.floor(Math.random() * hazardEmojis.length)]
      });
    }

    if (spawnTimer % 45 === 0) {
      // Spawn Items (Coins & Shields)
      const isShield = !player.shield && Math.random() < 0.2;
      items.push({
        x: Math.random() * (canvas.width - 40),
        y: -50,
        width: 32,
        height: 32,
        speed: gameSpeed * 0.8,
        type: isShield ? "shield" : "coin",
        emoji: isShield ? "🛡️" : "🪙"
      });
    }

    // Process & Render Hazards
    for (let i = hazards.length - 1; i >= 0; i--) {
      let h = hazards[i];
      h.y += h.speed;

      ctx.font = "34px serif";
      ctx.fillText(h.emoji, h.x + 18, h.y + 18);

      // Hazard Collision Check
      if (isColliding(player, h)) {
        spawnExplosion(h.x + 18, h.y + 18, "#ff3d00");
        hazards.splice(i, 1);

        if (player.shield) {
          player.shield = false;
          document.getElementById("shield-ui").style.display = "none";
          shakeTime = 8;
        } else {
          spawnExplosion(player.x + 22, player.y + 22, "#ff9100");
          gameOver();
          ctx.restore();
          return;
        }
        continue;
      }

      // Remove Offscreen Hazards
      if (h.y > canvas.height + 50) hazards.splice(i, 1);
    }

    // Process & Render Collectibles
    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.y += item.speed;

      ctx.font = "30px serif";
      ctx.fillText(item.emoji, item.x + 16, item.y + 16);

      // Collectible Collision Check
      if (isColliding(player, item)) {
        if (item.type === "coin") {
          score += 10;
          spawnExplosion(item.x + 16, item.y + 16, "#ffd700");
        } else if (item.type === "shield") {
          player.shield = true;
          document.getElementById("shield-ui").style.display = "flex";
          spawnExplosion(item.x + 16, item.y + 16, "#00e676");
        }
        document.getElementById("score").innerText = score;
        items.splice(i, 1);
        continue;
      }

      // Remove Offscreen Items
      if (item.y > canvas.height + 50) items.splice(i, 1);
    }

    // Update & Render Explosion Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      if (p.life <= 0) particles.splice(i, 1);
    }

    // Slowly increase game speed over time
    gameSpeed += 0.002;

    ctx.restore();
    requestAnimationFrame(gameLoop);
  }
</script>
</body>
</html>
